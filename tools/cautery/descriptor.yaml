# Tool descriptor (see tools/README.md). Every number is provisional until measured (cards meas-tools and rev-tools). Limits are what the simulation model enforces.
id: 7
name: cautery
class: cautery
mass_g: 110
tip_mm: [0, 0, -25]
retract_mm: 25
axes: []
power:
  max_current_a: 1.5
  hw_cutoff: true
