name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.17.3"

jobs:
  policy-check:
    name: policy-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Block files that must never be public
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)(\.env(\..*)?|[^/]*\.env|[^/]*\.key|[^/]*\.pem|credentials[^/]*|secrets/.*|phase3/.*)$' || true)
          if [ -n "$bad" ]; then
            echo "These files must not be tracked (see PUBLIC_POLICY.md):"
            echo "$bad"
            exit 1
          fi
          echo "No forbidden files tracked."

  firmware-tests:
    name: firmware-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the controller core with strict warnings
        run: g++ -std=c++17 -Wall -Wextra -Werror -O2 -Ifirmware/core firmware/core/controller.cpp firmware/tests/test_controller.cpp -o test_controller
      - name: Run the host tests
        run: ./test_controller
      - name: Build and run the board layer host tests (step queue and pin map)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 -Ifirmware/core -Ifirmware/board/controller_board firmware/tests/test_board.cpp -o test_board
          ./test_board
      - name: Build and run the tool interface tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 -Ifirmware/core firmware/core/controller.cpp firmware/tests/test_tools.cpp -o test_tools
          ./test_tools
      - name: Build and run the randomised tests (fuzz and invariants)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 -Ifirmware/core firmware/core/controller.cpp firmware/tests/test_fuzz.cpp -o test_fuzz
          ./test_fuzz
      - name: Run every test under the address and undefined-behaviour sanitizers
        run: |
          flags="-std=c++17 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -Ifirmware/core -Ifirmware/board/controller_board"
          g++ $flags firmware/core/controller.cpp firmware/tests/test_controller.cpp -o test_controller_san
          g++ $flags firmware/tests/test_board.cpp -o test_board_san
          g++ $flags firmware/core/controller.cpp firmware/tests/test_fuzz.cpp -o test_fuzz_san
          g++ $flags firmware/core/controller.cpp firmware/tests/test_tools.cpp -o test_tools_san
          ./test_controller_san && ./test_board_san && ./test_fuzz_san && ./test_tools_san
      - name: Line coverage of the controller core (minimum 95 %)
        run: python3 firmware/tests/coverage_check.py 95
      - name: Mutation check (every injected fault must make the tests fail)
        run: python3 firmware/tests/mutation_check.py

  firmware-board:
    name: firmware-board
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Cache the ESP32 core
        uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: arduino-esp32-3.3.12
      - name: Install the ESP32 core
        run: |
          url=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls "$url"
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
      - name: Compile the board layer for the ESP32-S3 with every warning on
        run: bash firmware/board/build.sh esp32:esp32:esp32s3

  python-checks:
    name: python-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt "ruff==${RUFF_VERSION}"
      - name: Lint
        run: ruff check .
      - name: Installation test
        run: python simulation/test_instalacion.py
      - name: Simulation geometry self-check
        run: python simulation/sim_brazo.py --check
      - name: Self-correction loop
        run: python simulation/loop_autocorreccion.py --out "${{ runner.temp }}/iteraciones.csv"
      - name: Coordinate frames and camera calibration self-check
        run: python host/coords/test_coords.py
      - name: Tool descriptors and the generated firmware table
        run: python tools/test_gen_tool_table.py
      - name: Camera overlay on simulated frames
        run: python host/overlay/test_overlay.py
      - name: LLM interface (validator, approval, log, scripted session)
        run: python host/llm/test_llm.py
      - name: Simulated tool models and the wash station
        run: python host/toolsim/test_toolsim.py
      - name: Host link tests against the simulated controller (builds the real core with g++)
        run: python host/link/test_link.py
      - name: Wiring map matches the firmware pins
        run: python cad/wiring.py --check
      - name: Error model self-check
        run: python simulation/sweep_errores.py --check
      - name: Error sweep (short)
        run: python simulation/sweep_errores.py --runs 10 --out "${{ runner.temp }}/barrido.csv" > /dev/null

  cad:
    name: cad
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cad.txt
      - name: Install the CAD dependencies
        run: pip install -r requirements-cad.txt
      - name: Build every part and run all the geometric checks
        run: python cad/build.py out
      - name: Compare the build with the committed expectation
        run: python cad/check_report.py out/report.json
      - name: Module registry tests
        run: python cad/test_modules.py
      - name: Tool modules (valid parts, envelope, mass, working point)
        run: python cad/tool_check.py
      - name: First-order mechanical review runs
        run: python cad/mech_review.py > /dev/null
      - name: Keep the build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-report
          path: out/report.json
          if-no-files-found: ignore
